<p-dialog header="Ficha do Evento" [(visible)]="visivel" [modal]="true" [draggable]="false"
  [resizable]="false" [style]="{ width: '420px' }" styleClass="rounded-2xl shadow-2xl">

  @if (evento(); as ev) {
  <div class="space-y-4 pt-1">

    <div class="flex items-start justify-between gap-3 border-b border-slate-100 pb-3">
      <div>
        <h4 class="text-lg font-bold text-slate-900">{{ ev.titulo }}</h4>
        <span class="text-xs text-slate-400">Código de registro #{{ ev.id }}</span>
      </div>
      <p-tag [value]="ev.ativo ? 'Ativo' : 'Inativo'" [severity]="ev.ativo ? 'success' : 'secondary'"
        [rounded]="true" />
    </div>

    <div class="space-y-2.5 text-sm">
      <div class="flex justify-between py-1 border-b border-slate-50">
        <span class="text-slate-400">Local:</span>
        <span class="font-medium text-slate-800">{{ ev.local }}</span>
      </div>
      <div class="flex justify-between py-1 border-b border-slate-50">
        <span class="text-slate-400">Data:</span>
        <span class="font-medium text-slate-800">{{ ev.data | date:'dd/MM/yyyy' }}</span>
      </div>
      <div class="flex justify-between py-1 border-b border-slate-50">
        <span class="text-slate-400">Ingresso:</span>
        <span class="font-bold text-slate-900">
          {{ ev.preco === 0 ? 'Gratuito' : (ev.preco | currency:'BRL') }}
        </span>
      </div>
      <div class="flex justify-between py-1">
        <span class="text-slate-400">Capacidade:</span>
        <span class="font-medium text-slate-800">{{ ev.capacidade }} pessoas</span>
      </div>
    </div>

    <div class="flex justify-end pt-3 border-t border-slate-100">
      <p-button label="Fechar" severity="secondary" (onClick)="visivel.set(false)" />
    </div>

  </div>
  }
</p-dialog>
