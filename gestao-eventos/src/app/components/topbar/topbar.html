<header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">

    <div class="flex items-center gap-3.5">
      <div class="p-1.5 bg-slate-900 rounded-xl flex items-center justify-center shadow-xs">
        <img src="Logo Cadastry.svg" alt="Cadastry Logo" class="h-7 w-auto invert brightness-200" />
      </div>
    </div>

    <div class="flex items-center gap-3">
      <p-button label="Novo Evento" icon="pi pi-plus" severity="success" (onClick)="novoEvento.emit()"
        styleClass="!bg-zinc-950 !border-zinc-950 font-semibold shadow-sm rounded-lg text-sm px-4 py-2" />

      @if (usuario(); as u) {
      <div class="hidden sm:flex flex-col items-end leading-tight pl-3 ml-1 border-l border-slate-200">
        <span class="text-sm font-semibold text-slate-800">{{ u.nome }}</span>
        <span class="text-xs text-slate-400">{{ u.email }}</span>
      </div>
      }
      <p-button icon="pi pi-sign-out" [rounded]="true" [text]="true" severity="secondary"
        ariaLabel="Sair" (onClick)="sair.emit()" />
    </div>

  </div>
</header>
