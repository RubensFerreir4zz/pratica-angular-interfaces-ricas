<div class="min-h-screen bg-slate-100/70 text-slate-800 antialiased font-sans pb-16">

  <app-topbar [usuario]="auth.usuario()" (novoEvento)="novo()" (sair)="sair()" />

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-8">

    <div class="space-y-4">
      <div>
        <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Painel de Eventos</h2>
        <p class="text-sm text-slate-500">Acompanhe métricas, capacidade e disponibilidade dos eventos cadastrados.</p>
      </div>

      <app-resumo-eventos [total]="eventService.totalEventos()" [ativos]="eventService.totalAtivos()" />
    </div>

    <app-evento-tabela
      [eventos]="eventService.eventos()"
      [carregando]="eventService.carregando()"
      [erro]="eventService.erro()"
      (detalhar)="detalhar($event)"
      (editar)="editar($event)"
      (remover)="remover($event)"
      (recarregar)="eventService.carregar()" />

  </div>

  <app-evento-form-dialog [(visivel)]="formVisivel" [evento]="eventoEmEdicao()" (salvar)="salvar($event)" />

  <app-evento-detalhes-dialog [(visivel)]="detalhesVisivel" [evento]="eventoSelecionado()" />

  <p-toast position="top-right" />
  <p-confirmdialog [style]="{ width: '420px' }" styleClass="rounded-2xl shadow-2xl" />
</div>
